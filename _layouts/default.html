<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description }}">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>

<body class="{{ page.body_class }}" data-watermark="{{ page.watermark | default: 'sandpile' }}">

<header class="site-header">
  <div class="container">

    <div class="site-title">
      <a href="{{ '/' | relative_url }}">Abdul Quadir</a>
      <span class="site-subtitle">Statistical physics · Complex systems · Number theory</span>
    </div>

    <nav class="navigation">

      <a
        href="{{ '/' | relative_url }}"
        class="{% if page.url == '/' %}active{% endif %}">
        Home
      </a>

      <a
        href="{{ '/research/' | relative_url }}"
        class="{% if page.url == '/research/' %}active{% endif %}">
        Research
      </a>

      <a
        href="{{ '/publications/' | relative_url }}"
        class="{% if page.url == '/publications/' %}active{% endif %}">
        Publications
      </a>

      <a
        href="{{ '/cv/' | relative_url }}"
        class="{% if page.url == '/cv/' %}active{% endif %}">
        CV
      </a>

      <a
        href="{{ '/posts/' | relative_url }}"
        class="{% if page.url == '/posts/' %}active{% endif %}">
        Notes
      </a>

    </nav>

  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer>
  <div class="container footer-inner">
    <p>© {{ "now" | date: "%Y" }} Abdul Quadir · <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    <p class="footer-formula">z<sub>c</sub> = 4 &nbsp;·&nbsp; P(s) ∼ s<sup>−τ</sup> &nbsp;·&nbsp; S(f) ∼ 1/f<sup>α</sup> &nbsp;·&nbsp; ℤ<sup>n</sup>/Δℤ<sup>n</sup></p>
  </div>
</footer>

<script src="{{ '/assets/js/watermark.js' | relative_url }}" defer></script>

</body>
</html>
